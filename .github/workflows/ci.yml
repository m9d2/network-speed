name: Build and publish RootHide package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RootHide deb
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project configuration
        run: |
          set -euo pipefail
          test -f Makefile
          test -f NetSpeedStatus.plist
          test -f Root.plist
          test -f Preferences/Info.plist
          test -f layout/Library/PreferenceLoader/Preferences/NetSpeedStatusPrefs.plist
          test -f control
          test -f Tweak.xm
          plutil -lint NetSpeedStatus.plist Root.plist Preferences/Info.plist layout/Library/PreferenceLoader/Preferences/NetSpeedStatusPrefs.plist
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml")'
          grep -Eq '^THEOS_PACKAGE_SCHEME = roothide$' Makefile
          grep -Eq '^Package: com\.m9d2\.wangsu$' control
          grep -Eq '^Architecture: iphoneos-arm64e$' control
          grep -q 'com.apple.springboard' NetSpeedStatus.plist
          grep -q '<string>PSLinkCell</string>' layout/Library/PreferenceLoader/Preferences/NetSpeedStatusPrefs.plist
          grep -q '<string>NSRootListController</string>' layout/Library/PreferenceLoader/Preferences/NetSpeedStatusPrefs.plist

      - name: Setup Theos and iOS SDK
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: roothide/theos
          theos-branch: master
          sdks-src: waruhachi/sdks
          sdks-branch: main
          libgcuniversal: "true"
          libgcuniversal-src: waruhachi/LibGcUniversal
          libgcuniversal-branch: main

      - name: Build package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Verify package output
        run: |
          set -euo pipefail
          packages=(packages/*.deb)
          test -e "${packages[0]}"
          file "${packages[0]}" | grep -qi 'debian binary package\|current ar archive'
          ar -t "${packages[0]}" | grep -Eq 'debian-binary|control.tar|data.tar'

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedStatus-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
